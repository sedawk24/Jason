<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous City Simulator</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/panel.css" />
</head>
<body>
  <div id="app">
    <div id="cityView">
      <canvas id="cityCanvas"></canvas>
      <div id="hud"><span id="fps">-- fps</span></div>
    </div>
    <div id="panel">
      <header id="panel-header">
        <span class="panel-title">Autonomous City Simulator</span>
        <div id="panel-actions">
          <button id="btn-legend" class="action-btn">Legend</button>
          <label class="overlay-label">Overlay
            <select id="overlay-select" aria-label="Data overlay">
              <option value="none">None</option>
              <option value="landvalue">Land value</option>
              <option value="coverage">Services</option>
              <option value="power">Power</option>
              <option value="congestion">Congestion</option>
            </select>
          </label>
          <button id="btn-save" class="action-btn">Save</button>
          <button id="btn-load" class="action-btn">Load</button>
          <button id="btn-new" class="action-btn">New City</button>
          <span id="panel-status" class="panel-status" role="status" aria-live="polite"></span>
        </div>
        <div id="time-section"></div>
      </header>
      <div id="panel-body">
        <div id="panel-stats"></div>
        <div id="panel-controls"></div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
